name: 构建 APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: 还原签名密钥
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少仓库 Secret KEYSTORE_B64，无法签名"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/guxibao.p12"

      - name: 编译 Release APK
        env:
          GUXIBAO_KEYSTORE_FILE: ${{ runner.temp }}/guxibao.p12
          GUXIBAO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GUXIBAO_KEY_ALIAS: guxibao
          GUXIBAO_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: 重命名产物
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          SRC=app/build/outputs/apk/release/app-release.apk
          DEST="app/build/outputs/apk/release/guxibao-${VERSION}.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "构建产物：$DEST"

      - name: 校验签名
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::未找到 apksigner，跳过签名校验"
            exit 0
          fi
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.apk.outputs.path }}"

      - uses: actions/upload-artifact@v4
        with:
          name: guxibao-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
